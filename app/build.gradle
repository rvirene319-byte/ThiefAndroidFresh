plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.thiefandroid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.thiefandroid'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1'

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }
}
